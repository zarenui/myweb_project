<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}"></head>
<body>
<header th:replace="~{fragments/navbar}"></header>
<main id="main-content" class="container">
    <h1>Новости</h1>
    <p>Обзоры обновлений и изменений в играх.</p>

    <div class="grid" th:if="${!#lists.isEmpty(newsInfos)}">
        <article class="card" th:each="news : ${newsInfos}">
            <h2 th:text="${news.title}">Название</h2>
            <p>
                <strong>Описание:</strong>
                <span th:text="${news.mainText}">Описание</span>
            </p>
            <a th:href="@{/news/{newsTitle}(newsTitle=${news.title})}">
                Подробнее
            </a>
        </article>
    </div>

    <p th:if="${#lists.isEmpty(newsInfos)}">
        Новости пока не добавлены.
    </p>
    <p th:replace="~{fragments/footer}"></p>
</main>
</body>
</html>
